[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77", "setuptools-scm>=8" ]

[project]
name = "cytodxrx"
description = "Diagnose and correct technical artifacts in image-based profiles."
readme = "README.md"
license = "BSD-3-Clause"
license-files = [ "LICENSE" ]
authors = [
  { name = "Gregory P. Way" },
]
requires-python = ">=3.11,<3.15"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [
  # used for numerical work
  "numpy>=1.26",
  # used for well-level profile and platemap tables
  "pandas>=2.2.2,<3",
]

[dependency-groups]
dev = [
  "hypothesis>=6,<7",
  "pre-commit>=3,<5",
  # provides testing capabilities for project
  "pytest>=8.2,<10",
  # used for linting and formatting
  "ruff>=0.8",
]
docs = [
  # used for theming the docsite
  "furo>=2024.8,<2027",
  # used for rendering markdown through sphinx
  "myst-parser>=3,<6",
  # used for building the docsite and its API pages from docstrings
  "sphinx>=7.4,<9",
  # used for copy buttons on code blocks
  "sphinx-copybutton>=0.5,<1",
]

[tool.setuptools]
packages.find.include = [ "cytodxrx*" ]

# set dynamic versioning capabilities for project based on git
[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.ruff]
target-version = "py311"
line-length = 88
lint.select = [
  # flake8-builtins
  "A",
  # flake8-annotations
  "ANN",
  # flake8-comprehensions
  "C4",
  # mccabe
  "C90",
  # pydocstyle (numpy docstring convention, see below)
  "D",
  # pycodestyle
  "E",
  # pyflakes
  "F",
  # isort
  "I",
  # pylint
  "PL",
  # ruff
  "RUF",
  # flake8-simplify
  "SIM",
  "W",
]
# Ignore `E402` and `F401` (unused imports) in all `__init__.py` files
lint.per-file-ignores."__init__.py" = [ "E402", "F401" ]
lint.per-file-ignores."docs/*" = [ "D", "E402" ]
lint.per-file-ignores."tests/*" = [ "ANN201", "ANN202", "D", "PLR0913", "PLR2004" ]
lint.pydocstyle.convention = "numpy"

[tool.pytest]
ini_options.testpaths = [ "tests" ]

[tool.mutmut]
source_paths = [ "cytodxrx/" ]
pytest_add_cli_args_test_selection = [ "tests/" ]
