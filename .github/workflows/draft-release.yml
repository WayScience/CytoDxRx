---
# workflow for drafting releases on GitHub
# see: https://github.com/release-drafter/release-drafter
name: release drafter

on:
  push:
    branches:
      - main

# draft updates run one at a time, so the last one reflects the latest push
concurrency:
  group: release-drafter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft_release:
    permissions:
      # write permission is required to create a github release
      contents: write
      # write permission is required for autolabeler
      # otherwise, read permission is required at least
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7.10.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
