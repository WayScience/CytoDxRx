---
# used for checking that the tests catch small faults injected into the code
# see: https://mutmut.readthedocs.io
# it reports faults that survive, and it does not fail the pull request
name: mutation testing

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - "cytodxrx/**"
      - "tests/**"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  mutmut:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # fetch tags for versioning details
          fetch-depth: 0
      - name: Fetch tags
        run: git fetch --all --tags
      - name: Python setup
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v10.3.2
      - name: Run mutation testing
        run: uv run --locked --with mutmut mutmut run
      - name: Report the faults that survived
        if: always()
        run: |
          {
            echo "## Faults that survived"
            echo '```'
            uv run --locked --with mutmut mutmut results
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
